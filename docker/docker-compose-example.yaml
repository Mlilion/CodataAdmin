# ============================================
# CodataAdmin Docker Compose 配置文件
# ============================================
# 使用方式:
#   开发环境: docker compose --env-file .env up -d
#   生产环境: docker compose --env-file .env -f docker-compose-example.yaml up -d
# ============================================

services:
  # ==================== 前端构建 Job ====================
  # profile-only: 普通 up -d 不会启动；由 deploy.sh build-web / 完整部署显式运行。
  frontend-build:
    image: node:20-alpine
    profiles: ["build"]
    working_dir: /app
    environment:
      CI: "true"
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm build &&
             rm -rf /web/dist &&
             mkdir -p /web &&
             cp -a dist /web/dist"
    volumes:
      - ../frontend/web:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
      - ./nginx/web:/web

  # ==================== 数据库服务 ====================
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?错误: 请设置 MYSQL_ROOT_PASSWORD 环境变量}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-codataadmin}"
      MYSQL_USER: "${MYSQL_USER:-codataadmin}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?错误: 请设置 MYSQL_PASSWORD 环境变量}"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app_network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 2g
          cpus: "1.0"

  # ==================== Redis 服务 ====================
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis/data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?错误: 请设置 REDIS_PASSWORD 环境变量}
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    networks:
      - app_network
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  # ==================== 语义检索副库（可选，P3）====================
  # PostgreSQL 派生检索副本：别名精确 + 全文（jieba + tsvector）+ 向量（pgvector）三路同库。
  # 非事实源 —— MySQL 保持权威，本库由 Release 快照编译而来，可随时 rebuild。
  # 不启用语义检索时可整段注释掉：后端 SEMANTIC_RETRIEVAL_ENABLE=false 即自动降级。
  # 用 pgvector 官方镜像（自带 vector 扩展，无需编译）；中文分词在 Python 侧用 jieba，
  # 故不需要 zhparser 扩展。
  semantic-pg:
    container_name: semantic-pg
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_DB: ${SEM_PG_DB:-semantic_retrieval}
      POSTGRES_USER: ${SEM_PG_USER:-semantic}
      POSTGRES_PASSWORD: "${SEM_PG_PASSWORD:?错误: 请设置 SEM_PG_PASSWORD 环境变量}"
    ports:
      # 宿主端口默认 5433，避开本机可能已有的 5432
      - "${SEM_PG_PORT:-5433}:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEM_PG_USER:-semantic} -d ${SEM_PG_DB:-semantic_retrieval}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 2g
          cpus: "1.0"

  # ==================== 后端初始化 Job ====================
  backend-init:
    container_name: backend-init
    build:
      context: ../
      dockerfile: ./docker/backend/Dockerfile
    image: backend:3.0.0
    restart: "no"
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
      DATABASE_HOST: "mysql"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD}"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "${MYSQL_DATABASE:-codataadmin}"
      DATABASE_USER: "${MYSQL_USER:-codataadmin}"
    command: ["python", "main.py", "init-db", "--env", "${DEPLOY_ENV:-prod}"]
    volumes:
      - ../backend:/home
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  # ==================== 后端服务 ====================
  backend:
    container_name: backend
    build:
      context: ../
      dockerfile: ./docker/backend/Dockerfile
    image: backend:3.0.0
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
      DATABASE_HOST: "mysql"
      DATABASE_PASSWORD: "${MYSQL_PASSWORD}"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "${MYSQL_DATABASE:-codataadmin}"
      DATABASE_USER: "${MYSQL_USER:-codataadmin}"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: "6379"
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    # 挂载宿主机代码到容器（热更新，生产环境保留以便读取 .env.prod 等配置文件）
    volumes:
      - ../backend:/home
    depends_on:
      backend-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/common/health\")' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4.0"
        reservations:
          memory: 2g
          cpus: "1.0"

  # ==================== Nginx 服务 ====================
  nginx:
    container_name: nginx
    image: nginx:1.25-alpine
    restart: unless-stopped
    platform: linux/amd64
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/web:/usr/share/nginx/html/web:ro
      # - ./nginx/app:/usr/share/nginx/html/app:ro
      # - ./nginx/docs:/usr/share/nginx/html/docs:ro
    depends_on:
      backend:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 128m
          cpus: "0.25"

# ==================== 持久化卷 ====================
volumes:
  frontend_node_modules:
    driver: local
  pnpm_store:
    driver: local

# ==================== 网络 ====================
networks:
  app_network:
    driver: bridge
